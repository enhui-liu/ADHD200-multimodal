seed: 42

data:
  dataset_path: data/processed/adhd200_multimodal.npz
  phenotype_dim: 24
  image_channels: 1
  num_classes: 2

model:
  phenotype_embedding_dim: 64
  imaging_embedding_dim: 128
  fusion_hidden_dim: 128
  dropout: 0.2

training:
  batch_size: 8
  epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.0001
  validation_fraction: 0.2
  num_workers: 0
  device: auto

output:
  checkpoint_path: models/mid_fusion_best.pt
  metrics_path: reports/metrics.json
