[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adhd200-multimodal"
version = "0.1.0"
description = "ADHD-200 phenotypic and neuroimaging mid-fusion experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3,<1.4",
    "matplotlib>=3.9,<4",
    "nibabel>=5.3,<6",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "torch>=2.4,<3",
    "tqdm>=4.66,<5",
    "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
]

[project.scripts]
adhd-train = "adhd200_multimodal.train:main"
adhd-evaluate = "adhd200_multimodal.evaluate:main"
adhd-phenotype-xgb = "adhd200_multimodal.phenotype_xgb:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
